<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTHOPUDI(TBB) | Enquiry </title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
     <header>
        <div class="logo">
            <a href="index.html">
            <img src="images/logo.jpg" alt="PhotoPudi Logo - Capturing Greatness">
        </a>
            <h1>PHOTOPUDI(TBB)</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="enquiry-section">
            <h2>Book a Photography Session</h2>
            <p>Fill out the form below to check date availability or request a custom quote.</p>

            <form action="#" method="post" id="enquiryForm">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required placeholder="e.g., Tumelo_M">

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="e.g., tumeloM@example.com">

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="e.g.,082 885 9696">

                <label for="serviceType">Select Package / Service:</label>
                <select id="serviceType" name="serviceType" required>
                    <option value="">-- Please Select --</option>
                    <option value="portrait">Portrait & Graduation Session</option>
                    <option value="event">Event Coverage</option>
                    <option value="commercial">Commercial / Branding</option>
                    <option value="custom">Other / Custom Request</option>
                </select>

                <label for="eventDate">Preferred Date:</label>
                <input type="date" id="eventDate" name="eventDate" required>

                <label for="message">Additional Details / Venue Location:</label>
                <textarea id="message" name="message" rows="5" placeholder="Tell us more about your photoshoot ideas..."></textarea>

                <button type="submit" class="btn">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 PHOTOPUDI(TBB). All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
    
</body>
</html>
